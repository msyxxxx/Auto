<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO ELITE — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fa;--line:#eceef2;--line2:#e2e5eb;--ink:#14181f;--muted:#848c9c;--accent:#ff6a1a;--accent-soft:#fff1e8;--accent-d:#e5540a;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tajawal,sans-serif}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;outline:none;border:none}
button{cursor:pointer}a{text-decoration:none;color:inherit}

.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:36px 28px;width:100%;max-width:400px;text-align:center;box-shadow:0 24px 60px rgba(20,24,31,.1)}
.box h1{font-size:24px;margin-bottom:6px;font-weight:900}.box h1 span{color:var(--accent)}
.box p{color:var(--muted);font-size:13px;margin-bottom:24px}
.box input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line2);background:#f7f8fa;color:var(--ink);font-size:15px;margin-bottom:12px;text-align:center;transition:.2s}
.box input:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.box button{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;transition:.2s}
.box button:hover:not(:disabled){background:var(--accent-d)}
.box button:disabled{opacity:.6;cursor:wait}
.back-link{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--accent);font-size:13px;font-weight:700;padding:8px 16px;border:1px solid var(--line2);border-radius:999px;transition:.2s}
.back-link:hover{background:var(--accent-soft)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px;font-weight:600}
</style></head><body>

<form class="box" id="loginForm">
  <h1>AUTO <span>ELITE</span></h1>
  <p>سجّل الدخول للوصول إلى لوحة التحكم</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username" autofocus>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button type="submit" id="btnLogin">دخول</button>
  <div class="err" id="loginErr"></div>
  <a href="index.html" class="back-link">← العودة إلى المتجر</a>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mrmnsizoqphzskudgazn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_V5iwg9qzUdMWshwBG5PcGQ_N6jtj7ce';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

// إذا كان المستخدم مسجل دخول بالفعل، انتقل مباشرة للوحة التحكم
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = 'admin.html';
});

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const btn = $('btnLogin');
  btn.disabled = true; btn.textContent = 'جارٍ الدخول...';

  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('pw').value
    });
    if (error) throw error;
    window.location.href = 'admin.html'; // نجاح
  } catch (err) {
    $('loginErr').textContent = err.message === 'Invalid login credentials' 
      ? 'البريد أو كلمة المرور غير صحيحة' 
      : err.message;
    btn.disabled = false; btn.textContent = 'دخول';
  }
};
</script>
</body></html>
